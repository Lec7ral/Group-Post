<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Group Poster</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      width: 280px; margin: 0; padding: 16px;
      font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #0f1115; color: #e6e8ee;
    }
    h1 { font-size: 15px; margin: 0 0 4px; }
    p { margin: 0 0 14px; color: #9aa1b1; }
    label { display: block; margin: 0 0 6px; color: #9aa1b1; font-size: 12px; }
    select {
      width: 100%; margin: 0 0 10px; padding: 8px 10px; border: 1px solid #2b3140;
      border-radius: 8px; background: #151922; color: #e6e8ee; font: inherit;
    }
    button {
      width: 100%; padding: 10px 12px; border: 0; border-radius: 8px;
      background: #4f7cff; color: #fff; font: inherit; font-weight: 600; cursor: pointer;
      margin-bottom: 8px;
    }
    button.secondary { background: #242b3a; color: #d7dbe6; }
    button:hover { filter: brightness(1.1); }
    button:disabled { opacity: .6; cursor: wait; }
    #status { margin-top: 10px; font-size: 11px; color: #9aa1b1; line-height: 1.4; }
    #status.error { color: #ff8f8f; }
    #status.ok { color: #7ee2a8; }
  </style>
</head>
<body>
  <h1>Group Poster</h1>
  <p>Publicación masiva sin límites.</p>
  <label for="workMode">Modo de trabajo</label>
  <select id="workMode">
    <option value="tab">Sobre la pestaña de Facebook abierta</option>
    <option value="newtab">Crear una pestaña nueva de Facebook</option>
  </select>
  <button id="scan">Cargar grupos desde Facebook</button>
  <button id="open" class="secondary">Abrir panel (supervisión)</button>
  <div id="status">Mantén una sesión de Facebook iniciada en este perfil de Chrome.</div>
  <script src="popup.js"></script>
</body>
</html>
